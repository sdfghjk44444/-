<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梦角 - 微信本地版</title>
    <style>
        /* --- 基础样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background-color: #f7f7f7; color: #333; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* --- 顶部导航 --- */
        .header { height: 50px; background-color: #ededed; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 17px; font-weight: bold; flex-shrink: 0; position: relative;}
        .header .title { position: absolute; left: 50%; transform: translateX(-50%); }
        .header-icons { display: flex; gap: 15px; font-size: 20px; font-weight: normal; z-index: 10; }
        .header-icons span { cursor: pointer; }

        /* --- 主内容区 --- */
        .content { flex: 1; overflow-y: auto; background-color: #f7f7f7; position: relative; display: flex; flex-direction: column; }
        .page { display: none; flex: 1; flex-direction: column; }
        .page.active { display: flex; }

        /* --- 聊天列表页 (微信) --- */
        .empty-text { text-align: center; color: #999; font-size: 14px; margin-top: 100px; line-height: 2; }
        .empty-text span { color: #333; font-weight: bold; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; background-color: #fff; border-bottom: 1px solid #eee; cursor: pointer;}
        .chat-avatar { width: 48px; height: 48px; background-color: #07c160; border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: bold;}
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-size: 16px; color: #333; margin-bottom: 4px; }
        .chat-msg { font-size: 13px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- 聊天窗口 (对话界面) --- */
        #chatWindow { background-color: #f5f5f5; }
        .chat-header-bar { height: 50px; background-color: #ededed; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #ddd; font-size: 17px;}
        .back-btn { font-size: 24px; margin-right: 15px; cursor: pointer; color: #333; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 80%; }
        .msg-row.left { align-self: flex-start; }
        .msg-row.right { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 5px; flex-shrink: 0; }
        .msg-row.left .msg-avatar { background-color: #07c160; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .msg-row.right .msg-avatar { background-color: #333; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .msg-bubble { padding: 10px 14px; border-radius: 6px; font-size: 15px; line-height: 1.5; word-break: break-all; }
        .msg-row.left .msg-bubble { background-color: #fff; border: 1px solid #e0e0e0; }
        .msg-row.right .msg-bubble { background-color: #95ec69; }
        .input-area { background-color: #f7f7f7; padding: 10px; display: flex; gap: 10px; border-top: 1px solid #ddd; padding-bottom: env(safe-area-inset-bottom); }
        .input-box { flex: 1; border: none; border-radius: 5px; padding: 10px; font-size: 15px; outline: none; background: #fff; }
        .send-btn { background-color: #07c160; color: #fff; border: none; border-radius: 5px; padding: 0 15px; font-size: 15px; cursor: pointer; }
        .draw-card-btn { background-color: #ff9800; color: white; border: none; border-radius: 5px; padding: 0 15px; font-size: 15px; cursor: pointer; font-weight: bold;}

        /* --- 通讯录页 --- */
        .contact-list { margin-top: 10px; }
        .contact-item { display: flex; align-items: center; padding: 12px 15px; background-color: #fff; border-bottom: 1px solid #eee; cursor: pointer;}
        .contact-icon { width: 40px; height: 40px; background-color: #07c160; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; margin-right: 12px; }
        .contact-info { flex: 1; }
        .contact-title { font-size: 16px; color: #333; margin-bottom: 4px; }
        .contact-subtitle { font-size: 13px; color: #999; }
